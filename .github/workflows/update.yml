name: تحديث قراءات فم الملاح

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch readings from Yahoo
        env:
          YAHOO_USER: ${{ secrets.YAHOO_USER }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
        run: python3 scripts/fetch_readings.py
      - name: Commit if changed
        run: |
          if git diff --quiet data.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update readings $(python3 -c "import json;print(json.load(open('data.json'))['readings'][0]['k'])")"
          git pull --rebase -q origin main || true
          git push
